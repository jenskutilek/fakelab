[project]
name = "fakelab"
version = "0.3.1"
description = "Fake FontLab Studio 5 for automated tests and external scripting"
keywords = ["fonttools", "vfb"]

readme = "README.md"
license = "GPL-3.0-or-later"

authors = [{ name = "Jens Kutílek", email = "webmail@kutilek.de" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

requires-python = ">=3.13"
dependencies = [
  "fakelab_menucommands >= 1.0.0",
  "vfblib >= 0.12.0, < 0.13.0",  # Could be made optional for a leaner test framework
]

[project.urls]
"Bug Tracker" = "https://github.com/jenskutilek/fakelab/issues"
"Changelog" = "https://github.com/jenskutilek/fakelab/blob/main/CHANGELOG.md"
"Documentation" = "https://fakelab.readthedocs.io/"
"Homepage" = "https://github.com/jenskutilek/fakelab"

[project.scripts]
fakelab = "FL.cmdline:main"

[project.optional-dependencies]
all = [
  "fakelab[generate]",
  "fakelab[repl]",
]
generate = [
  # Generate actual fonts with ufo2ft
  "ufo2ft >= 3.9.0",
  "mutatormath >= 3.0.1",
]
repl = [
  # Better interactive prompt
  "ptpython >= 3.0.32, < 3.1.0"
]

[dependency-groups]
dev = [
  "mypy >= 2.3.1",
  "ruff >= 0.16.7",
]
doc = [
  "sphinx_rtd_theme >= 3.1.0",
  "sphinx >= 9.1.0",
]
test = [
  "pytest-cov >= 7.1.0",
  "pytest >= 9.1.1",
  "tox-gh >= 1.8.0",
  "tox-uv >= 1.36.0",
  "tox >= 4.61.4",
  { include-group = "dev" },
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.coverage.paths]
source = ["src", ".tox/py*/**/site-packages"]

[tool.ruff]
extend-exclude = [
  "examples",
  "README.md",
]

[tool.ruff.lint]
ignore = [
  "N999",  # Mixed case module names
  "RUF023",  # Unsorted __slots__
]

[tool.ruff.lint.isort]
known-first-party = ["FL"]

[tool.uv.build-backend]
module-name = "FL"
# module-root = "src"
